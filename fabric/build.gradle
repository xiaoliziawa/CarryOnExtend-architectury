plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        createSourceSet = true
        modId = "carryonextend-datagen"
        outputDirectory = project(":common").file("src/main/generated")
        addToResources = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // CarryOn mod dependency (Fabric)
    implementation "curse.maven:carry-on-274259:$rootProject.carryon_fabric_file_id"

    // Lootr compatibility (optional, compile-only)
    compileOnly "curse.maven:lootr-fabric-615106:$rootProject.lootr_fabric_file_id"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    def properties = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        fabric_loader_version: rootProject.fabric_loader_version,
        architectury_api_version: rootProject.architectury_api_version,
        carryon_version: rootProject.carryon_version
    ]
    inputs.properties properties

    filesMatching('fabric.mod.json') {
        expand properties
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
