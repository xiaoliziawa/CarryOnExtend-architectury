plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // CarryOn mod dependency (NeoForge)
    implementation "curse.maven:carry-on-274259:$rootProject.carryon_neoforge_file_id"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

loom {
    runs {
        data {
            clientData()
            runDir 'run/data'
            preferGradleTask = true
            programArgs '--mod', 'carryonextend', '--all',
                '--output', project(':common').file('src/main/generated').absolutePath,
                '--existing', project(':common').file('src/main/resources').absolutePath
            mods {
                carryonextend {
                    sourceSet sourceSets.main
                    configuration configurations.shadowBundle
                }
            }
        }
    }
}

// The runtime transformer leaves classpath worker pools running after datagen.
tasks.named('runData') {
    mainClass = 'net.fabricmc.devlaunchinjector.Main'
    classpath = sourceSets.main.runtimeClasspath - configurations.common + configurations.shadowBundle
    dependsOn configurations.shadowBundle
}

processResources {
    def properties = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neoforge_version: rootProject.neoforge_version,
        architectury_api_version: rootProject.architectury_api_version,
        carryon_version: rootProject.carryon_version
    ]
    inputs.properties properties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
